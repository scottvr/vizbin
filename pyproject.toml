[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vizbin"
version = "0.1.0"
description = "Format-agnostic binary visualization: turn arbitrary byte streams into images to expose hidden structure."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "scottvr" }]
keywords = ["binary", "visualization", "reverse-engineering", "forensics", "bmp", "entropy"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Visualization",
    "Programming Language :: Python :: 3",
]
# Intentionally zero runtime dependencies. Everything is pure stdlib.
# BMP is written by hand; the animated GIF encoder is pure Python.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
vizbin = "vizbin.cli:main"

[project.urls]
Homepage = "https://github.com/scottvr/vizbin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
