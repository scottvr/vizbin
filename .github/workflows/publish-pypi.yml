name: Publish to PyPI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

jobs:
  test:
    name: Run test suite
    uses: ./.github/workflows/test.yaml

  build:
    name: Validate release and build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure tagged commit is on main
        run: |
          set -euo pipefail
          commit="$(git rev-parse 'HEAD^{commit}')"
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} points to ${commit}, which is not on main."
            echo "Merge to main first, then tag the commit on main."
            exit 1
          fi
          echo "Release gate passed: ${commit} is on main."

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Resolve canonical version (single source of truth)
        run: |
          set -euo pipefail
          version="$(PYTHONPATH=src python -c 'import vizbin; print(vizbin.__version__)')"
          if [ -z "$version" ]; then
            echo "Could not resolve vizbin.__version__"
            exit 1
          fi
          echo "VIZBIN_VERSION=${version}" >> "$GITHUB_ENV"
          echo "Canonical version: ${version}"

      - name: Validate tag matches package version
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "v${VIZBIN_VERSION}" ]; then
            echo "Tag/version mismatch: tag=${GITHUB_REF_NAME} expected=v${VIZBIN_VERSION}"
            exit 1
          fi
          echo "Tag/version check passed: ${GITHUB_REF_NAME}"

      - name: Validate CLI entrypoint version
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .
          cli_version="$(vizbin --version)"
          if [ "$cli_version" != "vizbin ${VIZBIN_VERSION}" ]; then
            echo "CLI/version mismatch: cli='${cli_version}' expected='vizbin ${VIZBIN_VERSION}'"
            exit 1
          fi
          echo "CLI entrypoint check passed: ${cli_version}"

      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          twine check dist/*

      - name: Validate distribution metadata version
        run: |
          set -euo pipefail
          python - "$VIZBIN_VERSION" <<'PY'
          import sys
          import tarfile
          from email.parser import Parser
          from pathlib import Path
          from zipfile import ZipFile

          expected = sys.argv[1]
          versions = {}

          for wheel in Path("dist").glob("*.whl"):
              with ZipFile(wheel) as archive:
                  name = next(n for n in archive.namelist()
                              if n.endswith(".dist-info/METADATA"))
                  meta = Parser().parsestr(archive.read(name).decode("utf-8"))
              versions[wheel.name] = meta["Version"]

          for sdist in Path("dist").glob("*.tar.gz"):
              with tarfile.open(sdist, "r:gz") as archive:
                  name = next(n for n in archive.getnames()
                              if n.endswith("/PKG-INFO"))
                  member = archive.extractfile(name)
                  if member is None:
                      raise RuntimeError(f"Could not read {name}")
                  meta = Parser().parsestr(member.read().decode("utf-8"))
              versions[sdist.name] = meta["Version"]

          if not versions:
              raise SystemExit("No distributions found in dist/")

          bad = {n: v for n, v in versions.items() if v != expected}
          if bad:
              detail = ", ".join(f"{n}={v}" for n, v in sorted(bad.items()))
              raise SystemExit(f"Metadata/version mismatch: expected={expected}; {detail}")

          print(f"Distribution metadata check passed: {expected}")
          PY

      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI (Trusted Publishing)
    needs: [test, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vizbin
    permissions:
      id-token: write

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
